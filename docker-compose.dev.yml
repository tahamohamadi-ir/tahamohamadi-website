# Docker Compose — Local Development
# Backend services only. Frontend runs locally with `npm run dev` for hot reload.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   cd frontend && npm run dev
#
# Access:
#   http://localhost:3000  → Next.js (local, hot reload)
#   http://localhost:8000  → Django API (Docker)
#   http://localhost:5432  → PostgreSQL (Docker)

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tahamohamadi}
      POSTGRES_USER: ${POSTGRES_USER:-taha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taha} -d ${POSTGRES_DB:-tahamohamadi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      # Override for local dev: allow requests from localhost:3000
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    volumes:
      - media_data:/app/media
      - ./backend:/app  # Mount source for auto-reload (Gunicorn --reload)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/public/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
