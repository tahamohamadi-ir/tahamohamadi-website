upstream django {
    server django:8000;
}

upstream nextjs {
    server nextjs:3000;
}

server {
    listen 80;
    server_name _;

    # --- Public API routes (CDN-cacheable) ---

    location /api/public/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CDN-cacheable: shared caches may store for 1h, serve stale for 24h while revalidating
        add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400" always;
    }

    # --- Preview endpoint (no-store, noindex) ---
    # Must appear before the generic /api/public/ match wouldn't catch it (it does via prefix),
    # but we use exact nested location for specificity.

    location /api/public/workflow/preview/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preview responses must never be cached or indexed
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # --- Admin API routes (no-cache) ---

    location /api/admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admin responses must never be cached by CDN or browser
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- Catch-all /api/ (admin-related or misc Django endpoints) ---

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admin responses must never be cached
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- Django static files (collectstatic output, content-hashed) ---

    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Immutable: content-hashed filenames allow aggressive caching (1 year)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Media files (user uploads, content-hash named) ---

    location /media/ {
        alias /srv/media/;

        # Immutable: media files use content-hash naming, safe to cache forever
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Next.js static assets (_next/static with content hashes) ---

    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Immutable: Next.js build output uses content-hashed filenames
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Next.js (everything else — public pages) ---

    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Public pages: CDN-cacheable with short browser cache, longer CDN cache
        add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400" always;

        # WebSocket support for Next.js HMR in development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
