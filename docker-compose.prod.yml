# Docker Compose — Production
# Production-ready orchestration with HTTPS, health checks, restart policies,
# resource limits, and network isolation.
#
# Usage:
#   # First time: obtain SSL certificates
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#     --webroot --webroot-path=/var/www/certbot \
#     -d tahamohamadi.ir -d www.tahamohamadi.ir
#
#   # Start all services
#   docker compose -f docker-compose.prod.yml up -d
#
#   # Renew certificates (run via cron)
#   docker compose -f docker-compose.prod.yml run --rm certbot renew
#   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# Requirements: 14.6, 14.7

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ─── Redis (Celery broker) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  # ─── Django (Gunicorn) ───────────────────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    volumes:
      - media_data:/app/media
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/public/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    volumes:
      - media_data:/app/media
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
        reservations:
          memory: 128M
          cpus: "0.1"

  # ─── Celery Beat (Scheduler) ────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  # ─── Next.js (Standalone) ───────────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - frontend
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ─── Nginx (Reverse Proxy + SSL) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - frontend
    depends_on:
      django:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  # ─── Certbot (SSL certificate management) ───────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - frontend
    # Certbot runs on-demand (not as a persistent service).
    # Usage: docker compose -f docker-compose.prod.yml run --rm certbot renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
    name: tahamohamadi_frontend
  backend:
    driver: bridge
    name: tahamohamadi_backend
    internal: true  # No external access — only inter-service communication

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: tahamohamadi_postgres_data
  media_data:
    name: tahamohamadi_media_data
  redis_data:
    name: tahamohamadi_redis_data
  certbot_webroot:
    name: tahamohamadi_certbot_webroot
  certbot_certs:
    name: tahamohamadi_certbot_certs
